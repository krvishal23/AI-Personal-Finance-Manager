services:
  - type: web
    name: ai-personal-finance-manager
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: finance-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
